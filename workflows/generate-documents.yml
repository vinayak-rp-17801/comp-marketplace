name: Generate Compliance Documents

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'compliance_document_generator.py'

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
      
      - name: Run compliance document generator
        run: python compliance_document_generator.py
      
      - name: Commit generated documents
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: auto-generate compliance documents" || echo "No changes to commit"
          git push
