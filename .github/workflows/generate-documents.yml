name: Generate Compliance Documents

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
      
      - name: Verify script was updated
        run: |
          echo "📋 Current script version:"
          head -20 compliance_document_generator.py
      
      - name: Run compliance document generator
        run: python compliance_document_generator.py
      
      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage generated content, not extracted files
          git add generated_documents/ COMPLIANCE_GENERATION_REPORT.md
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "Committing generated documents..."
            git commit -m "chore: auto-generate compliance documents [skip ci]"
            git push origin main
          fi
