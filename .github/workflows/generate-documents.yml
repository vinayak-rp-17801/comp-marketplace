name: Generate Compliance Documents

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'compliance_document_generator.py'

permissions:
  contents: write

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
      
      - name: Run compliance document generator
        run: python compliance_document_generator.py
      
      - name: Commit and push generated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generate compliance documents"
            git push origin main
          fi
